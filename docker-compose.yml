name: vite-gourmand

services:
  app:
    build:
      context: .
    image: vite-gourmand-app:local
    ports:
      - "8081:80"
    environment:
      APP_NAME: ViteEtGourmand
      APP_ENV: local
      APP_DEBUG: "true"
      APP_DISPLAY_ERRORS: "true"
      APP_LOG_ERRORS: "true"
      APP_LOG_PATH: storage/logs/app.log
      APP_TIMEZONE: Europe/Paris
      APP_URL: http://localhost:8081
      APP_KEY: docker_local_change_me
      SESSION_NAME: vite_gourmand_session
      SESSION_LIFETIME_MINUTES: "120"
      SESSION_SECURE: "false"
      SESSION_HTTP_ONLY: "true"
      SESSION_SAME_SITE: Lax
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_NAME: vite_gourmand
      DB_USER: vite_gourmand
      DB_PASSWORD: vite_gourmand
      NOSQL_CONNECTION: mongodb
      NOSQL_HOST: mongo
      NOSQL_PORT: "27017"
      NOSQL_DATABASE: vite_gourmand
      MAIL_MAILER: log
      MAIL_HOST: localhost
      MAIL_PORT: "1025"
      MAIL_FROM_ADDRESS: no-reply@example.test
      MAIL_FROM_NAME: Vite et Gourmand
      MAIL_CONTACT_TO: contact@vitegourmand.test
    depends_on:
      mysql:
        condition: service_healthy
      mongo:
        condition: service_healthy
    volumes:
      - ./storage/logs:/var/www/html/storage/logs

  mysql:
    image: mysql:8.4
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: vite_gourmand
      MYSQL_USER: vite_gourmand
      MYSQL_PASSWORD: vite_gourmand
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/sql/create_database.sql:/docker-entrypoint-initdb.d/01-create_database.sql:ro
      - ./database/sql/seed_database.sql:/docker-entrypoint-initdb.d/02-seed_database.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 10

  mongo:
    image: mongo:7
    ports:
      - "27018:27017"
    environment:
      MONGO_INITDB_DATABASE: vite_gourmand
    volumes:
      - mongo_data:/data/db
      - ./database/mongodb/create_collections.js:/docker-entrypoint-initdb.d/01-create_collections.js:ro
      - ./database/mongodb/seed_mongodb.js:/docker-entrypoint-initdb.d/02-seed_mongodb.js:ro
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  mysql_data:
  mongo_data:
